name: CI-CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev lcov gcovr

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build

    - name: Run tests directly
      run: |
        cd build
        ./run_tests

    - name: Debug - check gcda files
      run: |
        cd build
        echo "=== Checking for .gcda files ==="
        ls -la *.gcda 2>/dev/null || echo "No .gcda files in root"
        ls -la CMakeFiles/run_tests.dir/ 2>/dev/null || echo "No run_tests.dir"
        find . -name "*.gcda" -ls

    - name: Generate coverage report
      run: |
        cd build
        lcov --capture --directory . --output-file coverage.info --no-external --ignore-errors empty
        lcov --remove coverage.info '/usr/*' --output-file coverage.info --ignore-errors empty
        lcov --remove coverage.info '*/tests/*' --output-file coverage.info --ignore-errors empty
        lcov --remove coverage.info '*/_deps/*' --output-file coverage.info --ignore-errors empty
        lcov --list coverage.info --ignore-errors empty

    - name: Upload to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./build/coverage.info
        flags: cpp-tests
        name: music-salon-coverage
        fail_ci_if_error: false

    - name: Done
      run: echo "Build, tests and coverage completed!"